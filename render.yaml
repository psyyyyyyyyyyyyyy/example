services:
  - type: web
    name: mediaboard-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mediaboard-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: mediaboard-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mediaboard-db
          property: password
    healthCheckPath: /api/health

databases:
  - name: mediaboard-db
    databaseName: mediaboard
    user: mediaboard
