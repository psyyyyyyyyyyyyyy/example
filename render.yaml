services:
  - type: web
    name: media-board-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/media-board-backend-1.0.0.jar
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 10000
